apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.0          # <-- the upgrade knob
      helm:
        valueFiles:
          - $values/values-harbor.yaml
    - repoURL: https://github.com/Dhampyru/harbor-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false      # deliberately off — see below
      selfHeal: true
